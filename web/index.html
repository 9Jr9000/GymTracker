<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root {
  --paper: #F1F2EF;
  --field: #FFFFFF;
  --ink: #1C2127;
  --graphite: #5E6670;
  --rule: #D3D6D1;
  --plate: #C8322B;
  --lift: #1B7A43;
  --lift-soft: #E1F0E6;
  --on-ink: #F1F2EF;
  --on-lift: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --text: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1D2228; --field: #272D34; --ink: #ECEEF0; --graphite: #9AA3AD; --rule: #3A424B;
    --plate: #F0564B; --lift: #3DBE74; --lift-soft: #1F3A2B; --on-ink: #1D2228; --on-lift: #0F2418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1D2228; --field: #272D34; --ink: #ECEEF0; --graphite: #9AA3AD; --rule: #3A424B;
  --plate: #F0564B; --lift: #3DBE74; --lift-soft: #1F3A2B; --on-ink: #1D2228; --on-lift: #0F2418;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .3; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
main.wrap { padding-bottom: 56px; }
body.resting main.wrap { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar-in { display: flex; align-items: center; min-height: 50px; gap: 8px; }
.viewtabs { display: flex; margin-left: -10px; }
.viewtab { background: none; border: 0; padding: 14px 10px 12px; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1; color: var(--graphite); position: relative; }
.viewtab[aria-current="page"] { color: var(--ink); }
.viewtab[aria-current="page"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; background: var(--ink); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--graphite); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--graphite); }
.status[data-state="saved"]::before { background: var(--lift); }
.status[data-state="saving"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--graphite); }
.status[data-state="error"] { color: var(--plate); }
.status[data-state="error"]::before { background: var(--plate); }

.hero { padding: 22px 0 4px; }
.hero h1, .page-title { font-family: var(--display); font-weight: 700; font-size: clamp(46px, 13vw, 68px); line-height: .92; letter-spacing: -0.015em; margin: 0; }
.dateline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 10px; }
.date-text { font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--graphite); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; font-size: 15px; }
.summary { margin: 6px 0 0; color: var(--graphite); font-size: 15px; }
.daynote { margin: 6px 0 0; font-size: 15px; font-weight: 500; }

.days { display: flex; gap: 6px; overflow-x: auto; margin: 16px -16px 6px; padding: 0 16px 12px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.daychip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: transparent; border: 1.5px solid var(--ink); border-radius: 4px; padding: 6px 11px 7px; text-align: left; }
.dc-name { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.05; white-space: nowrap; }
.dc-sub { font-size: 12px; color: var(--graphite); white-space: nowrap; }
.daychip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.daychip[aria-pressed="true"] .dc-sub { color: var(--on-ink); opacity: .75; }

.ex { border-top: 2px solid var(--ink); padding: 14px 0 20px; }
.ex-head { display: flex; align-items: flex-start; gap: 12px; }
.ex-title { flex: 1; min-width: 0; }
.ex-name { font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.05; margin: 2px 0 0; }
.ex-sub { margin: 3px 0 0; font-size: 14px; color: var(--graphite); }
.edit-tools { display: flex; gap: 6px; }
.iconbtn { flex: 0 0 auto; min-width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; background: transparent; border: 1.5px solid var(--rule); border-radius: 6px; color: var(--ink); }
.iconbtn.danger { color: var(--plate); }
.iconbtn.armed { background: var(--plate); border-color: var(--plate); color: #fff; padding: 0 12px; font-weight: 600; font-size: 15px; }
.last { margin: 8px 0 12px; font-size: 14.5px; color: var(--graphite); }
.last b { color: var(--ink); font-weight: 600; }

.setrow { display: grid; grid-template-columns: 40px minmax(0,1fr) minmax(0,1fr) 52px; gap: 8px; align-items: center; margin-bottom: 8px; }
.setrow.single { grid-template-columns: 40px minmax(0,1fr) 52px; }
.setrow.head { margin-bottom: 4px; font-size: 12.5px; color: var(--graphite); }
.setrow.head span { text-align: center; }
.setno { height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); color: var(--graphite); line-height: 1; }
.setno .n { font-size: 21px; font-weight: 600; }
.setno .tag { font-size: 12px; font-weight: 700; margin-top: 2px; min-height: 13px; }
.setno.up .tag { color: var(--lift); }
.setno.pr .n { color: var(--plate); }
.setno.pr .tag { color: #fff; background: var(--plate); padding: 1px 4px; border-radius: 2px; }
.num { width: 100%; height: 48px; background: var(--field); border: 1.5px solid var(--rule); border-radius: 6px; padding: 0 6px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 25px; color: var(--ink); font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; }
.num::placeholder { color: var(--graphite); opacity: .5; font-weight: 500; }
.num:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.setrow.done .num { border-color: var(--lift); background: var(--lift-soft); }
.check { height: 48px; width: 100%; display: grid; place-items: center; background: var(--field); border: 1.5px solid var(--rule); border-radius: 6px; color: var(--graphite); }
.check svg { opacity: .4; }
.check[aria-pressed="true"] { background: var(--lift); border-color: var(--lift); color: var(--on-lift); }
.check[aria-pressed="true"] svg { opacity: 1; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 0 20px; }
.textbtn { background: none; border: 0; padding: 8px 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.textbtn.dim { color: var(--graphite); font-weight: 500; }
.textbtn.danger, .textbtn.armed { color: var(--plate); }
.textbtn.armed { font-weight: 700; }
.field { width: 100%; min-height: 44px; background: var(--field); border: 1.5px solid var(--rule); border-radius: 6px; padding: 9px 12px; font-size: 16px; color: var(--ink); }
.field:focus { outline: none; border-color: var(--ink); }
.note { margin-top: 6px; }
.date-field { width: auto; min-height: 40px; padding: 6px 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--ink); }
.logfoot { border-top: 2px solid var(--ink); padding-top: 18px; }
.addform h3 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 10px; }
.addrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; margin-top: 8px; }
.formmsg { min-height: 20px; margin: 6px 0 0; font-size: 14px; color: var(--plate); }
.foot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 16px; }
.empty { color: var(--graphite); padding: 12px 0; margin: 0; }

.grid-wrap { overflow-x: auto; margin: 18px 0 6px; padding-bottom: 4px; }
.yeargrid { display: block; }
.yeargrid .c-rest { fill: var(--rule); }
.yeargrid .c-future { fill: var(--rule); opacity: .4; }
.yeargrid .c-trained { fill: var(--plate); }
.yeargrid .c-today { stroke: var(--ink); stroke-width: 1.5; }
.yeargrid text { font-family: var(--text); font-size: 11px; fill: var(--graphite); }
.caption { margin: 4px 0 0; color: var(--graphite); font-size: 15px; }
.sec-title { font-family: var(--display); font-weight: 600; font-size: 27px; margin: 30px 0 6px; }
.sess { border-top: 1.5px solid var(--rule); }
.sess:last-child { border-bottom: 1.5px solid var(--rule); }
.sess summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 12px 0; }
.sess summary::-webkit-details-marker { display: none; }
.s-date { font-weight: 600; }
.s-day { font-family: var(--display); font-weight: 600; font-size: 19px; text-align: right; }
.s-day::after { content: " +"; color: var(--graphite); }
.sess[open] .s-day::after { content: " \2212"; }
.s-meta { grid-column: 1 / -1; font-size: 14px; color: var(--graphite); }
.s-body { padding: 0 0 14px; }
.s-ex { margin: 0 0 6px; font-size: 15px; color: var(--graphite); }
.s-ex b { color: var(--ink); font-weight: 600; }
.s-actions { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-top: 10px; }
.export { margin-top: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.export p { margin: 0; font-size: 14px; color: var(--graphite); }

.prog-head { padding: 22px 0 4px; }
.prog-controls { display: grid; gap: 10px; margin-top: 16px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; width: max-content; max-width: 100%; }
.seg button { background: transparent; border: 0; padding: 8px 12px; font-size: 14.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.chart-wrap { margin: 18px 0 4px; min-height: 60px; }
.chart { display: block; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.chart .dot.pr { fill: var(--plate); stroke: var(--plate); }
.chart text { font-family: var(--text); font-size: 12px; fill: var(--graphite); }
.chart text.val { font-family: var(--display); font-weight: 600; font-size: 17px; fill: var(--ink); }
.legend { font-size: 13px; color: var(--graphite); margin: 2px 0 0; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--plate); margin-right: 5px; }
.stats { margin: 14px 0 0; padding: 0; list-style: none; font-size: 15px; }
.stats li { padding: 3px 0; }
.stats b { font-weight: 600; }
.table-wrap { overflow-x: auto; margin-top: 20px; }
.ptable { width: 100%; border-collapse: collapse; font-size: 15px; }
.ptable th { text-align: left; font-weight: 500; color: var(--graphite); font-size: 13px; padding: 0 10px 6px 0; border-bottom: 1.5px solid var(--ink); }
.ptable td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ptable td:first-child { white-space: nowrap; font-weight: 600; }
.ptable td:last-child, .ptable th:last-child { text-align: right; padding-right: 0; white-space: nowrap; }

.restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--ink); color: var(--on-ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.restbar-in { display: flex; align-items: center; gap: 12px; min-height: 62px; }
.rest-label { font-size: 15px; opacity: .8; }
.rest-time { font-family: var(--display); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
.rest-hide { margin-left: auto; background: transparent; color: var(--on-ink); border: 1.5px solid currentColor; border-radius: 6px; min-height: 40px; padding: 0 14px; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .restbar { animation: rise .18s ease-out; }
  .setno.pr .tag { animation: stamp .28s ease-out; }
  @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes stamp { 0% { transform: scale(1.8); opacity: 0; } 100% { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <nav class="viewtabs" aria-label="Sections">
      <button type="button" class="viewtab" data-view="log">Log</button>
      <button type="button" class="viewtab" data-view="history">History</button>
      <button type="button" class="viewtab" data-view="progress">Progress</button>
    </nav>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="restbar" id="restbar" hidden>
  <div class="wrap restbar-in">
    <span class="rest-label">Resting</span>
    <span class="rest-time" id="rest-time">0:00</span>
    <button type="button" class="rest-hide" id="rest-hide">Hide</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  /* ---------------- Plan ---------------- */
  const DAYS = [
    { key: "legs", name: "Legs" },
    { key: "back-chest", name: "Back & Chest" },
    { key: "tri-bi", name: "Tri & Bi" },
    { key: "back-bi", name: "Back & Bi" },
    { key: "chest-tri", name: "Chest & Tri" },
    { key: "abs", name: "Abs" },
    { key: "forearm", name: "Forearm" }
  ];
  const DAY_NOTES = { abs: "Circuit: all three back to back, 2 rounds." };
  const SHOULDER_NOTE = "Placeholder. Use Edit exercises to swap in your shoulder moves.";
  const DEFAULT_PLAN = {
    "legs": [
      { name: "Squat", type: "wr" }, { name: "Romanian Deadlift", type: "wr" }, { name: "Barbell Hip Thrust", type: "wr" },
      { name: "Leg Extension", type: "wr" }, { name: "Leg Curl (machine)", type: "wr" }, { name: "Adductor/Abductor", type: "wr" },
      { name: "Calf Raises", type: "wr" }
    ],
    "back-chest": [
      { name: "Incline Smith Press", type: "wr" }, { name: "Pec Deck", type: "wr", note: "Or the pec deck/rear delt combo machine" },
      { name: "High-to-Low Crossover", type: "wr" }, { name: "Pull-Ups", type: "bw" }, { name: "Lat Pulldown", type: "wr" },
      { name: "Single-Arm Cable Row", type: "wr" }, { name: "Barbell Shrugs", type: "wr" }
    ],
    "tri-bi": [
      { name: "Cable Pushdown (V-bar)", type: "wr", note: "Plus a single-arm finisher each side" }, { name: "Dips", type: "bw" },
      { name: "Overhead Rope Extension", type: "wr", note: "Long head" }, { name: "Incline DB Curl", type: "wr", note: "Long head" },
      { name: "Preacher Curl", type: "wr", note: "Short head" }, { name: "Hammer Curl", type: "wr" },
      { name: "Shoulder Work", type: "wr", note: SHOULDER_NOTE }
    ],
    "back-bi": [
      { name: "Pull-Ups", type: "bw" }, { name: "Lat Pulldown", type: "wr" }, { name: "Single-Arm Cable Row", type: "wr" },
      { name: "Barbell Shrugs", type: "wr" }, { name: "Preacher Curl", type: "wr" }, { name: "Incline DB Curl", type: "wr" },
      { name: "Barbell/Hammer Curl Finisher", type: "wr" }, { name: "Shoulder Work", type: "wr", note: SHOULDER_NOTE }
    ],
    "chest-tri": [
      { name: "Incline Smith Press", type: "wr" }, { name: "Close-Grip Pin Press", type: "wr" }, { name: "Pec Deck", type: "wr" },
      { name: "High-to-Low Crossover", type: "wr" }, { name: "Cable Pushdown (V-bar)", type: "wr", note: "Plus a single-arm finisher each side" },
      { name: "Overhead Rope Extension", type: "wr", note: "Long head" }, { name: "Dips", type: "bw", note: "To failure, finisher" }
    ],
    "abs": [
      { name: "Cable Crunches", type: "wr", sets: 2 }, { name: "Dead Bugs", type: "bw", sets: 2 },
      { name: "Plank", type: "time", sets: 2, note: "To failure" }
    ],
    "forearm": [
      { name: "Cable Wrist Curl", type: "wr" }, { name: "Reverse Wrist Extension", type: "wr" },
      { name: "Reverse Grip Cable Curls", type: "wr" }, { name: "Farmer's Carry", type: "carry" }
    ]
  };
  const TYPES = {
    wr: { label: "Weight and reps", fields: ["w", "r"], heads: ["lb", "Reps"] },
    bw: { label: "Bodyweight reps", fields: ["w", "r"], heads: ["Added lb", "Reps"] },
    time: { label: "Timed hold", fields: ["s"], heads: ["Seconds"] },
    carry: { label: "Weight and time", fields: ["w", "s"], heads: ["lb", "Seconds"] }
  };
  const maxOf = (a, f) => a.reduce((m, x) => Math.max(m, f(x) || 0), 0);
  const sumOf = (a, f) => a.reduce((m, x) => m + (f(x) || 0), 0);
  const METRICS = {
    wr: [
      { key: "top", label: "Top weight", unit: "lb", f: s => maxOf(s, x => x.w) },
      { key: "e1rm", label: "Est. 1RM", unit: "lb", f: s => maxOf(s, x => e1rm(x.w, x.r)) },
      { key: "vol", label: "Volume", unit: "lb", f: s => sumOf(s, x => (x.w || 0) * (x.r || 0)) }
    ],
    bw: [
      { key: "best", label: "Best set", unit: "reps", f: s => maxOf(s, x => x.r) },
      { key: "total", label: "Total reps", unit: "reps", f: s => sumOf(s, x => x.r) }
    ],
    time: [
      { key: "best", label: "Longest hold", unit: "sec", f: s => maxOf(s, x => x.s) },
      { key: "total", label: "Total time", unit: "sec", f: s => sumOf(s, x => x.s) }
    ],
    carry: [
      { key: "top", label: "Top weight", unit: "lb", f: s => maxOf(s, x => x.w) },
      { key: "long", label: "Longest carry", unit: "sec", f: s => maxOf(s, x => x.s) }
    ]
  };
  const LS = { sessions: "wt2.sessions", synced: "wt2.synced", plan: "wt2.plan", deletes: "wt2.deletes", ui: "wt2.ui", migrated: "wt2.migratedV1" };
  const OLD_KEY = "ax_tracker_history_v1";
  const PLAN_ID = "__plan";

  /* ---------------- Utils ---------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const norm = s => String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");
  const pad2 = n => String(n).padStart(2, "0");
  const clone = o => JSON.parse(JSON.stringify(o));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseYmd(s) { const p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function todayYmd() { return ymd(new Date()); }
  function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s).getTime()); }
  function yr(d) { return d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""; }
  function fmtShort(s) { const d = parseYmd(s); return MON[d.getMonth()] + " " + d.getDate() + yr(d); }
  function fmtMed(s) { const d = parseYmd(s); return DOW[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate() + yr(d); }
  function fmtLong(s) { const d = parseYmd(s); return DOW_LONG[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate() + yr(d); }
  function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function parseNum(v, isInt) {
    const s = String(v == null ? "" : v).trim().replace(",", ".");
    if (!s) return null;
    const n = Number(s);
    if (!isFinite(n) || n < 0) return null;
    return isInt ? Math.round(n) : Math.round(n * 100) / 100;
  }
  function parseSecs(v) {
    const m = /^(\d+):([0-5]?\d)$/.exec(String(v == null ? "" : v).trim());

  function yearGrid(all) {

  function drawChart(ctx) {

    if (!points.length) { wrap.append(h("p", { class: "empty", text: "Nothing to chart for " + metric.label.toLowerCase() + " yet." })); return; }
    const W = Math.max(280, Math.floor(wrap.clientWidth || 320)), H = 220, L = 52, R = 18, T = 28, B = 28;
    const xs = points.map(p => parseYmd(p.date).getTime()), ys = points.map(p => p.y);
    const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);

    const ticks = dMax - dMin < 1e-9 ? [dMin] : [dMin, (dMin + dMax) / 2, dMax];

    });
    svg.appendChild(sv("text", { x: X(x0), y: H - 8, "text-anchor": x1 === x0 ? "middle" : "start" }, fmtShort(points[0].date)));
    if (x1 !== x0) svg.appendChild(sv("text", { x: W - R, y: H - 8, "text-anchor": "end" }, fmtShort(points[points.length - 1].date)));
    if (points.length > 1) svg.appendChild(sv("path", { class: "line", d: points.map((p, k) => (k ? "L" : "M") + X(xs[k]).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ") }));
    points.forEach((p, k) => {
      const c = sv("circle", { class: "dot" + (p.pr ? " pr" : ""), cx: X(xs[k]).toFixed(1), cy: Y(p.y).toFixed(1), r: p.pr ? 5 : 4 });

  }

  /* ---------------- Rest timer ---------------- */
  const rest = { start: 0, timer: null };
  function tickRest() {
    const s = Math.floor((Date.now() - rest.start) / 1000);
    $("#rest-time").textContent = Math.floor(s / 60) + ":" + pad2(s % 60);
    if (s >= 600) stopRest();
  }
  function startRest() {
    rest.start = Date.now();
    $("#restbar").hidden = false;
    document.body.classList.add("resting");
    tickRest();
    clearInterval(rest.timer);
    rest.timer = setInterval(tickRest, 500);
  }
  function stopRest() {
    clearInterval(rest.timer);
    $("#restbar").hidden = true;
    document.body.classList.remove("resting");
  }
  $("#rest-hide").addEventListener("click", stopRest);

  /* ---------------- Sync ---------------- */
  function updateStatus() {
    const el = $("#status");
    let st, txt, tip;
    if (remote.mode === "local") { st = "local"; txt = "Saved on device"; tip = "Saved in this browser only"; }
    else if (remote.error) { st = "error"; txt = remote.error; tip = "Your sets are saved in this browser and will sync when the connection is back"; }
    else if (remote.mode === "connecting") { st = "saving"; txt = "Connecting"; tip = "Loading your saved workouts"; }
    else if (remote.pending.size) { st = "saving"; txt = "Saving"; tip = "Saving your latest sets"; }
    else { st = "saved"; txt = "Saved"; tip = "Saved to your account"; }
    el.dataset.state = st; el.textContent = txt; el.title = tip;
  }
  async function withRetry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === "unavailable") { await sleep(500 + Math.random() * 900); return await fn(); }
      throw e;
    }
  }
  const FATAL = ["revoked", "not_granted", "capability_disabled", "capability_removed", "invalid_argument", "transform_error"];
  const remote = {
    mode: "connecting", error: null, rootRef: null, col: null,
    timers: {}, inflight: {}, again: {}, pending: new Set(), retryTimer: null, lastSync: 0, syncing: false,
    push(id, now) {
      if (remote.mode !== "cloud") { updateStatus(); return; }
      remote.pending.add(id);
      clearTimeout(remote.timers[id]);
      remote.timers[id] = setTimeout(() => { delete remote.timers[id]; remote.flush(id); }, now ? 0 : 900);
      updateStatus();
    },
    flushAll() {
      Object.keys(remote.timers).forEach(id => { clearTimeout(remote.timers[id]); delete remote.timers[id]; remote.flush(id); });
    },
    async flush(id) {
      if (remote.mode !== "cloud") return;
      if (remote.inflight[id]) { remote.again[id] = true; return; }
      remote.inflight[id] = true;
      let ok = false;
      try {
        if (id === PLAN_ID) {
          if (planState) await withRetry(() => remote.rootRef.set(clone({ plan: planState.days, planUpdatedAt: planState.updatedAt })));
        } else {
          const body = sessions[id], ref = remote.col.doc(id);
          if (body) {
            const at = body.updatedAt;
            await withRetry(() => ref.set(clone(body)));
            synced[id] = at;
          } else if (synced[id] != null || pendingDeletes.has(id)) {
            await withRetry(() => ref.delete());
            delete synced[id];
            pendingDeletes.delete(id);
            saveDeletes();
          }
          lsSet(LS.synced, synced);
        }
        ok = true;
        remote.error = null;
      } catch (e) {
        remote.onError(e);
      }
      remote.inflight[id] = false;
      if (remote.again[id]) { remote.again[id] = false; remote.flush(id); return; }
      if (ok) remote.pending.delete(id);
      updateStatus();
    },
    onError(e) {
      const code = e && e.code;
      if (FATAL.indexOf(code) >= 0) { remote.goLocal(); return; }
      remote.error = code === "quota_exceeded" ? "Cloud full" : "Retrying sync";
      clearTimeout(remote.retryTimer);
      remote.retryTimer = setTimeout(() => { remote.error = null; Array.from(remote.pending).forEach(id => remote.flush(id)); }, code === "quota_exceeded" ? 60000 : 15000);
    },
    goLocal() {
      remote.mode = "local";
      Object.keys(remote.timers).forEach(id => clearTimeout(remote.timers[id]));
      remote.timers = {}; remote.pending.clear(); remote.error = null;
      clearTimeout(remote.retryTimer);
      updateStatus();
    },
    async sync() {
      if (remote.syncing || !remote.col) return;
      remote.syncing = true;
      try {
        commitWork(false);
        const res = await Promise.all([withRetry(() => remote.rootRef.get()), withRetry(() => remote.col.limit(1000).get())]);
        const out = mergeRemote(res[0], res[1]);
        remote.mode = "cloud"; remote.error = null; remote.lastSync = Date.now();
        out.toPush.forEach(id => remote.push(id, true));
        if (out.planPush) remote.push(PLAN_ID, true);
        if (out.changed) {
          const f = captureFocus();
          if (state.view === "log") state.work = buildWork(state.date, state.day);
          render();
          restoreFocus(f);
        }
      } catch (e) {
        const code = e && e.code;
        if (FATAL.indexOf(code) >= 0) remote.goLocal();
        else { remote.error = remote.mode === "cloud" ? "Retrying sync" : null; setTimeout(() => remote.sync(), 20000); }
      } finally {
        remote.syncing = false;
        updateStatus();
      }
    }
  };
  function mergeRemote(rootSnap, qs) {
    let changed = false;
    const toPush = [], remoteIds = new Set();
    qs.docs.forEach(doc => {
      const r = sanitizeSession(doc.id, doc.data());
      if (!r) return;
      remoteIds.add(doc.id);
      if (pendingDeletes.has(doc.id) && !sessions[doc.id]) { toPush.push(doc.id); return; }
      const l = sessions[doc.id];
      if (l && (l.updatedAt || 0) > (r.updatedAt || 0)) { toPush.push(doc.id); return; }
      if (!l || JSON.stringify(l) !== JSON.stringify(r)) { sessions[doc.id] = r; changed = true; }
      synced[doc.id] = r.updatedAt || 0;
    });
    Object.keys(sessions).forEach(id => {
      if (remoteIds.has(id)) return;
      if (synced[id] != null && (sessions[id].updatedAt || 0) <= synced[id]) { delete sessions[id]; delete synced[id]; changed = true; }
      else toPush.push(id);
    });
    Array.from(pendingDeletes).forEach(id => { if (!remoteIds.has(id)) { pendingDeletes.delete(id); delete synced[id]; } });
    let planPush = false;
    const rd = rootSnap && rootSnap.exists ? rootSnap.data() : null;
    if (rd && rd.plan && typeof rd.plan === "object") {
      const rAt = +rd.planUpdatedAt || 0, lAt = planState ? planState.updatedAt || 0 : -1;
      if (rAt >= lAt) {
        const np = sanitizePlan(rd.plan);
        if (JSON.stringify(np) !== JSON.stringify(plan)) changed = true;
        plan = np; planState = { days: plan, updatedAt: rAt }; lsSet(LS.plan, planState);
      } else planPush = true;
    } else if (planState) planPush = true;
    sortedCache = null;
    lsSet(LS.sessions, sessions); lsSet(LS.synced, synced); saveDeletes();
    return { changed: changed, toPush: toPush, planPush: planPush };
  }
  function captureFocus() {
    const a = document.activeElement;
    if (!a || !a.dataset || !a.dataset.fk) return null;
    return { fk: a.dataset.fk, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(f) {
    if (!f) return;
    const el = document.querySelector('[data-fk="' + f.fk + '"]');
    if (el) { el.focus(); try { el.setSelectionRange(f.s, f.e); } catch (e) {} }
  }
  async function connect() {
    const C = window.claude;
    if (!C || typeof C.use !== "function") { remote.goLocal(); return; }
    Promise.resolve(C.use("downloads")).then(d => { downloadsNs = d || null; if (downloadsNs && state.view === "history") render(); }, () => {});
    let db = null, user = null;
    try { const r = await Promise.all([C.use("db"), C.use("user")]); db = r[0]; user = r[1]; } catch (e) {}
    if (!db || !user) { remote.goLocal(); return; }
    let uid = null;
    try { uid = await user.id(); } catch (e) {}
    if (!uid) { remote.goLocal(); return; }
    try {
      remote.rootRef = db.doc("data/users/" + uid + "/tracker");
      remote.col = remote.rootRef.collection("sessions");
    } catch (e) { remote.goLocal(); return; }
    await remote.sync();
  }

  /* ---------------- Lifecycle ---------------- */
  function rollDate() {
    const t = todayYmd();
    if (state.dateIsToday && state.date !== t) {
      commitWork(false);
      state.date = t;
      state.work = buildWork(t, state.day);
      if (state.view === "log") render();
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { commitWork(true); remote.flushAll(); }
    else {
      rollDate();
      if (remote.mode === "cloud" && Date.now() - remote.lastSync > 10 * 60 * 1000) remote.sync();
    }
  });
  window.addEventListener("pagehide", () => { commitWork(true); remote.flushAll(); });
  document.querySelectorAll(".viewtab").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

  migrateOld();
  state.work = buildWork(state.date, state.day);
  render();
  updateStatus();
  connect();
})();
</script>
</body>
</html>
